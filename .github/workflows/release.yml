name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish through npm trusted
# publishing (OIDC, with provenance; the publish uses no npm token) -> docs artifacts -> GitHub
# release -> repository_dispatch to cosyte/docs. Uses the DOCS_REPO_DISPATCH_TOKEN and
# RELEASE_PR_TOKEN secrets (passed via `secrets: inherit`), the second so the "Version Packages"
# pull request it opens runs its checks. The trusted publisher registered for this package on
# npmjs.com names this repository, this file (`release.yml`) and the `release` environment, so
# renaming the file or the environment stops every publish.
#
# A published reference (ST37), the same one every other caller here names, so a release of this
# package runs the same pipeline, with the same gates, as the rest of the suite, and nothing in it
# changes until this line moves.
#
# A RUN SITTING AT `waiting` IS THE HUMAN GATE, NOT A FAILURE. The shared pipeline's publishing job
# runs in this repository's `release` environment, which carries a required reviewer and a
# deployment branch policy limited to `main`. A release run parks there until a reviewer approves
# it, and that approval is what publishes to npm. Never remove the reviewer, and never add an
# `environment:` key to the job below: either would publish with nobody in the loop, and a published
# version cannot be withdrawn.

on:
  push:
    branches: [main]

# Read-only by default: the release job below grants itself the writes the shared pipeline needs.
permissions:
  contents: read

jobs:
  release:
    # Required. A called workflow can only downgrade the caller's token, never escalate it, so the
    # calling job has to grant everything the shared pipeline declares. Short one scope and GitHub
    # rejects the whole workflow at startup (no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this repository's `release` environment protection
      contents: write # create the tag and the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@workflows-2026-11-07-498c7c13c886
    with:
      package-name: "@cosyte/dates"
    secrets: inherit
