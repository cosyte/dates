name: CI

# The gate for this repository, from the commit that gave it a package.
#
# ONE GATE JOB, RUN ON EACH SUPPORTED NODE LINE. Every rung runs inside `verify`, on Node 22 (the
# floor `engines` declares), 24 and 26: the lines every @cosyte/* library tests (ST15). Beside it,
# `actionlint` lints the workflow files once, as the shared CI's job of that name does in every
# other library (see the note on that job below).
#
# THE NODE 22 LEG KEEPS THE CONTEXT NAME `verify`, AND THAT IS LOAD-BEARING. The branch ruleset
# requires a check named exactly `verify`, and a matrix job is otherwise reported as `verify (22)`,
# which would leave every pull request waiting for a context nothing emits. So the job name is an
# expression: the Node 22 leg is `verify`, the others `verify (node 24)` and `verify (node 26)`.
# Only `verify` is required today; requiring the others is a ruleset change, made once each has
# run on `main`.
#
# REPO-LOCAL, NOT THE ORG REUSABLE, for two reasons that still hold:
#
#   1. The reusable runs a FIXED ladder and no arbitrary repo script, so it
#      cannot run this repository's dash gate, PHI scan or document checks.
#      Those have to be in whichever workflow is the gate, and here it is this one.
#   2. Its ladder includes a dual ESM/CJS smoke import. This package is ESM only
#      by decision, ships no CommonJS build, and would be red on arrival for a
#      reason no change here should fix.
#
# So this job runs Node 26 itself rather than taking it from the shared CI's matrix.
#
# The dash gate ALSO has its own workflow (`no-emdash.yml`), and the overlap
# is on purpose. That one runs on the `edited` activity type so it re-checks a
# pull request's title and body, which is the squash-merge commit message; this
# one scans the tracked files as part of the status a sweep reads. Neither
# subsumes the other.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run, 05:49 UTC on main's latest commit. Odd minute: GitHub delays runs at the top of the hour, and each repo has its own.
    - cron: "49 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # The required context: see the note above before changing this line or the matrix.
    name: ${{ matrix.node == 22 && 'verify' || format('verify (node {0})', matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input: the action reads `packageManager` from package.json,
      # which is the same pin the lockfile was written by. Naming a version here
      # would be a second source of truth for one fact.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node 22 is the engine floor the package declares, so the gate proves the floor rather than
      # whatever the runner happens to ship; Node 24 and 26 are the newer long-term lines.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The typed-exports gate the release pipeline runs before it publishes, run on every pull
      # request as well, so a change that breaks how the types resolve is red before it merges.
      - name: Types resolve (attw)
        run: pnpm run attw

      # The programs under examples/ import the package by its name, which resolves through the
      # package's own `exports` to the build above, and each one checks its own output. They run
      # as a step of this job rather than a job of their own, to keep the single status above.
      - name: Examples
        run: pnpm run examples

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # The shared PHI scan (`cosyte-phi-scan` from @cosyte/script-utils, ST34): the cross-cutting
      # floor over the whole repository. The values this package handles are dates of birth and
      # admission times, so a fixture or an example must never carry a real one.
      - name: PHI scan
        run: pnpm run phi-scan

      - name: Test
        run: pnpm run test

      # The shared 90% coverage gate from @cosyte/vitest-config, over `src/`.
      - name: Test coverage
        run: pnpm run test:coverage

      # The package promises the host time zone changes nothing. A suite that
      # only ever runs under the runner's zone cannot notice a regression that
      # reintroduces a host-zone dependency, so it runs again from the other side
      # of the world.
      - name: Test under two host time zones
        run: pnpm run test:tz

      # The shared em and en dash gate (`cosyte-no-emdash`), over every tracked file and file name.
      - name: Em and en dash gate
        run: pnpm run check:no-emdash

      # The house checks on this repository's documents and its catalog entry, all from
      # @cosyte/script-utils (RD1, RD2, RD4, PF1). Steps of this job, so they gate a merge.
      - name: The README follows the house skeleton
        run: pnpm run check:readme

      - name: The CLAUDE.md card follows its spec
        run: pnpm run check:claude-card

      - name: Every pointer into the agent notes resolves
        run: pnpm run check:agent-notes

      - name: The package description is the catalog's
        run: pnpm run check:catalog

  # Workflow linting, as every other @cosyte/* library has it (EN6): the shared CI's `actionlint`
  # job, whose steps run here because this repository does not call the shared CI (see the note at
  # the top). rhysd/actionlint's release binary is downloaded at the version below and checked
  # against the SHA-256 below before it is unpacked, so a changed asset fails the job; the pair is
  # the one the shared job pins (cosyte/.github#93), and a new version changes both values together,
  # here and there. Never reviewdog/action-actionlint, which from v1.75.0 installs actionlint by
  # piping a fork's script to bash. The job fails on actionlint's own exit status, over every
  # tracked workflow file. shellcheck is preinstalled on the hosted runner, and actionlint silently
  # skips its shell checks without it, so the install step refuses to continue when it is missing.
  #
  # A job of its own rather than a rung of `verify`: it needs no Node and no install, and inside the
  # matrix it would lint the same files three times. Its context is `actionlint`, which no ruleset
  # requires yet; requiring it is a ruleset change, made once it has run on `main`.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint at the pinned version and checksum
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version
          shellcheck --version

      - name: actionlint over .github/workflows/
        shell: bash
        run: |
          set -euo pipefail
          listed="$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')"
          if [ -z "${listed}" ]; then
            echo "::error::no workflow file found under .github/workflows/"
            exit 1
          fi
          mapfile -t files <<< "${listed}"
          "${RUNNER_TEMP}/actionlint" -color "${files[@]}"
          echo "actionlint clean over ${#files[@]} workflow file(s)."
