name: CI

# The gate for this repository, from the commit that gave it a package.
#
# ONE GATE JOB, RUN ON EACH SUPPORTED NODE LINE AND SYSTEM. Every rung runs inside `verify`, on
# Node 22 (the floor `engines` declares), 24 and 26, the lines every @cosyte/* library tests, each
# on Linux, Windows and macOS. Beside it, `actionlint` lints the workflow files once, as the shared
# CI's job of that name does in every other library (see the note on that job below).
#
# THE LINUX NODE 22 LEG KEEPS THE CONTEXT NAME `verify`, AND THAT IS LOAD-BEARING. The branch
# ruleset requires a check named exactly `verify`, and a matrix job is otherwise reported as
# `verify (22, ubuntu-latest)`, which would leave every pull request waiting for a context nothing
# emits. So the job name is an expression: the Linux Node 22 leg is `verify`, the other Linux legs
# `verify (node 24)` and `verify (node 26)`, and the Windows and macOS legs
# `verify (windows-latest, node 22)` and so on. Requiring the Windows and macOS legs is a ruleset
# change, made once each has run on `main`.
#
# REPO-LOCAL, NOT THE ORG REUSABLE, for two reasons that still hold:
#
#   1. The reusable runs a FIXED ladder and no arbitrary repo script, so it
#      cannot run this repository's dash gate, PHI scan or document checks.
#      Those have to be in whichever workflow is the gate, and here it is this one.
#   2. Its ladder includes a dual ESM/CJS smoke import. This package is ESM only
#      by decision, ships no CommonJS build, and would be red on arrival for a
#      reason no change here should fix.
#
# So the testing standard's jobs the shared CI runs behind its inputs (the `os` list of systems,
# `run-bun`, `run-deno`, `run-coverage-ratchet` and `run-mutation`) run here as jobs of this
# workflow, with the shared jobs' steps, as `scaling-gate` and `bench-compare` already did. The
# standard is cosyte/config's documentation/decisions/0004-the-testing-standard.md.
#
# The dash gate ALSO has its own workflow (`no-emdash.yml`), and the overlap
# is on purpose. That one runs on the `edited` activity type so it re-checks a
# pull request's title and body, which is the squash-merge commit message; this
# one scans the tracked files as part of the status a sweep reads. Neither
# subsumes the other.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run, 05:49 UTC on main's latest commit. Odd minute: GitHub delays runs at the top of the hour, and each repo has its own.
    - cron: "49 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # The required context: see the note above before changing this line or the matrix.
    name: ${{ matrix.os == 'ubuntu-latest' && (matrix.node == 22 && 'verify' || format('verify (node {0})', matrix.node)) || format('verify ({0}, node {1})', matrix.os, matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # About four times the slowest leg's expected time, for a Windows runner's slower install and
    # child processes.
    timeout-minutes: 30
    # Bash on every system, so each step means the same thing on Windows as on Linux.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input: the action reads `packageManager` from package.json,
      # which is the same pin the lockfile was written by. Naming a version here
      # would be a second source of truth for one fact.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node 22 is the engine floor the package declares, so the gate proves the floor rather than
      # whatever the runner happens to ship; Node 24 and 26 are the newer long-term lines.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The typed-exports gate the release pipeline runs before it publishes, run on every pull
      # request as well, so a change that breaks how the types resolve is red before it merges.
      - name: Types resolve (attw)
        run: pnpm run attw

      # The programs under examples/ import the package by its name, which resolves through the
      # package's own `exports` to the build above, and each one checks its own output. They run
      # as a step of this job rather than a job of their own, to keep the single status above.
      - name: Examples
        run: pnpm run examples

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # The shared PHI scan (`cosyte-phi-scan` from @cosyte/script-utils): the cross-cutting floor
      # over the whole repository. The values this package handles are dates of birth and admission
      # times, so a fixture or an example must never carry a real one. It reads the committed bytes,
      # which are the same on every system, so it runs on the Linux legs.
      - name: PHI scan
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run phi-scan

      - name: Test
        run: pnpm run test

      # The 100% coverage gate from vitest.config.ts, over `src/`.
      - name: Test coverage
        run: pnpm run test:coverage

      # The package promises the host time zone changes nothing. A suite that
      # only ever runs under the runner's zone cannot notice a regression that
      # reintroduces a host-zone dependency, so it runs again from the other side
      # of the world. `pnpm run test:tz` sets `TZ` in POSIX shell syntax, which the Windows
      # command shell pnpm runs scripts with does not read, so on Windows this step sets it
      # from bash for each of the same two runs.
      - name: Test under two host time zones
        if: ${{ runner.os != 'Windows' }}
        run: pnpm run test:tz

      - name: Test under two host time zones (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          TZ=UTC pnpm run test
          TZ=Pacific/Kiritimati pnpm run test

      # The checks below read the repository's own files, which are the same bytes on every
      # system, so they run on the Linux legs.
      #
      # The shared em and en dash gate (`cosyte-no-emdash`), over every tracked file and file name.
      - name: Em and en dash gate
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run check:no-emdash

      # The house checks on this repository's documents and its catalog entry, all from
      # @cosyte/script-utils. Steps of this job, so they gate a merge.
      - name: The README follows the house skeleton
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run check:readme

      - name: The CLAUDE.md card follows its spec
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run check:claude-card

      - name: The package description is the catalog's
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run check:catalog

      # The process wiring (`cosyte-process check` from @cosyte/process): the script bodies delegate
      # to `cosyte-process`, `cosyte-process.config.json` is valid, and the direct `vitest` is
      # exactly the version process runs.
      - name: The process wiring is the shared one
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm run check:process

  # THE TEST SUITE UNDER BUN AND UNDER DENO, the steps of the shared CI's `bun` and `deno` jobs (its
  # `run-bun` and `run-deno` inputs). Each installs with pnpm from the committed lockfile, as
  # `verify` does, then runs this repository's `test` script on the other runtime: Bun with
  # `bun --bun run test`, so every `node` a script starts is Bun; Deno with `deno task test`, with
  # Node taken off PATH so nothing falls back to it. Under Deno the cases that read the build are
  # skipped by name (test/support/runtime.ts says why). Neither is required yet; requiring them is
  # a ruleset change, made once each has run on `main`.
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The Bun version the shared CI's `bun-version` input defaults to.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: pnpm install --frozen-lockfile
      - name: The test suite under Bun
        shell: bash
        run: |
          set -euo pipefail
          echo "bun: $(bun --version)"
          bun --bun run test

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The Deno version the shared CI's `deno-version` input defaults to.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.8"
      - run: pnpm install --frozen-lockfile
      # Deno's task runner runs a script's literal `node` with the real Node whenever one is on
      # PATH, so every PATH entry that holds a `node` is replaced by a mirror of it without one, and
      # the step refuses to run the suite if a `node` is still reachable.
      - name: The test suite under Deno
        shell: bash
        run: |
          set -euo pipefail
          shadow="${RUNNER_TEMP}/path-without-node"
          rm -rf "${shadow}"
          kept=()
          count=0
          IFS=':' read -r -a entries <<< "${PATH}"
          for entry in "${entries[@]}"; do
            if [ -n "${entry}" ] && [ -e "${entry}/node" ]; then
              count=$((count + 1))
              mirror="${shadow}/${count}"
              mkdir -p "${mirror}"
              for tool in "${entry}"/*; do
                if [ "${tool##*/}" != node ]; then ln -s "${tool}" "${mirror}/"; fi
              done
              echo "deno: ${entry} holds a node, so PATH names ${mirror} in its place, with everything else in it"
              entry="${mirror}"
            fi
            kept+=("${entry}")
          done
          PATH="$(IFS=':'; echo "${kept[*]}")"
          if found="$(command -v node)"; then
            echo "::error::a node is still on PATH at ${found}, so the suite would run under Node rather than Deno"
            exit 1
          fi
          echo "deno: $(deno --version | head -n 1)"
          deno task test

  # THE TESTING STANDARD'S TWO PULL REQUEST JOBS, the steps of the shared CI's `coverage-ratchet`
  # and `mutation` jobs. Both run beside `verify`, never after it, so a pull request waits for the
  # slowest job rather than their sum.
  #
  # `coverage-ratchet` runs `pnpm test:coverage` and holds coverage to quality-floor.json with
  # `cosyte-ratchet` (@cosyte/script-utils): on a pull request against the base branch too, so every
  # changed line coverage counts must have run and no floor may be lowered or removed; on any other
  # event against the floor file alone.
  coverage-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, so the merge base is on disk for the changed lines.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: The coverage ratchet
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(check --skip mutation)
          if [ -n "${BASE_REF}" ]; then args+=(--base "origin/${BASE_REF}"); fi
          report="${RUNNER_TEMP}/coverage-ratchet.txt"
          status=0
          pnpm exec cosyte-ratchet "${args[@]}" > "${report}" 2>&1 || status=$?
          cat "${report}"
          {
            echo "### Coverage against the floor"
            echo
            echo '```text'
            cat "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

  # `mutation` (pull requests only) mutates the source files the change touched with
  # stryker.config.mjs (`cosyte-mutate changed`, @cosyte/vitest-config) and requires every mutant in
  # the changed lines to be killed. A change with no changed source file starts no run and passes.
  mutation:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutate the changed files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pnpm exec cosyte-mutate changed --base "origin/${BASE_REF}"
      - name: The mutation ratchet over the changed code
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/mutation-ratchet.txt"
          status=0
          pnpm exec cosyte-ratchet check --skip coverage --base "origin/${BASE_REF}" > "${report}" 2>&1 || status=$?
          cat "${report}"
          {
            echo "### Mutants in the changed code"
            echo
            echo '```text'
            cat "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Keep the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-changed
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14

  # Workflow linting, as every other @cosyte/* library has it: the shared CI's `actionlint`
  # job, whose steps run here because this repository does not call the shared CI (see the note at
  # the top). rhysd/actionlint's release binary is downloaded at the version below and checked
  # against the SHA-256 below before it is unpacked, so a changed asset fails the job; the pair is
  # the one the shared job pins (cosyte/.github#93), and a new version changes both values together,
  # here and there. Never reviewdog/action-actionlint, which from v1.75.0 installs actionlint by
  # piping a fork's script to bash. The job fails on actionlint's own exit status, over every
  # tracked workflow file. shellcheck is preinstalled on the hosted runner, and actionlint silently
  # skips its shell checks without it, so the install step refuses to continue when it is missing.
  #
  # A job of its own rather than a rung of `verify`: it needs no Node and no install, and inside the
  # matrix it would lint the same files nine times. Its context is `actionlint`, which no ruleset
  # requires yet; requiring it is a ruleset change, made once it has run on `main`.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint at the pinned version and checksum
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version
          shellcheck --version

      - name: actionlint over .github/workflows/
        shell: bash
        run: |
          set -euo pipefail
          listed="$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')"
          if [ -z "${listed}" ]; then
            echo "::error::no workflow file found under .github/workflows/"
            exit 1
          fi
          mapfile -t files <<< "${listed}"
          "${RUNNER_TEMP}/actionlint" -color "${files[@]}"
          echo "actionlint clean over ${#files[@]} workflow file(s)."

  # THE PERFORMANCE STANDARD'S TWO PULL REQUEST JOBS, the steps of the shared CI's `scaling-gate`
  # and `bench-compare` jobs, run here because this repository does not call the shared CI (see the
  # note at the top). Both run beside `verify`, never after it, so a pull request waits for the
  # slowest job rather than their sum. The standard is cosyte/config's
  # documentation/decisions/0005-the-performance-standard.md.
  #
  # `scaling-gate` runs `pnpm test:perf`: the scaling gate in test/perf/scaling-gate.perf.ts and its
  # self-check, never under coverage. No ruleset requires it yet; requiring it is a ruleset change,
  # made once it has run on `main`.
  scaling-gate:
    runs-on: ubuntu-latest
    # The gate times each phase for well under a second and its self-check about as long again; the
    # bound is for an install and a suite that hang, inside the 15 minute budget for a pull request.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Node 22, the engine floor, as the `verify` context runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf

  # `bench-compare` (pull requests only) builds the base beside the head and times both with
  # `cosyte-bench compare`, interleaved on one runner: 12 rounds, each running every case once on
  # each side in a fresh process, back to back, so the runner's noise lands on both. The head's
  # suite is handed either build, so a case the head adds is timed on the base too. Only the sizes
  # bench/dates.bench.mjs marks for comparison run here; the bench-reading workflow reads them all.
  #
  # IT IS ADVISORY AND NEVER FAILS: the tool's exit (1 a regression, 2 a case it could not measure)
  # becomes an annotation on the run's page, never a red check, until an A/A calibration of this
  # suite on this runner class shows false alarms under 1%. Never require it. The results document
  # (results-v1, checked with `cosyte-bench check`) and its Markdown are kept in the
  # `bench-comparison` artifact.
  bench-compare:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # The comparison stops itself at BENCH_BUDGET_SECONDS below and reports it; this bound is for an
    # install or a build that hangs.
    timeout-minutes: 15
    steps:
      # The whole history, so the base commit is on disk for a worktree beside the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # ONE STEP, AND IT ENDS 0 WHATEVER HAPPENS: a base that does not build or a spent budget ends
      # it with a note, never a red check.
      - name: Compare the base build with the head build
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BENCH_SUITE: bench/dates.bench.mjs
          BENCH_TARGET: dist/index.js
          BENCH_BUDGET_SECONDS: "600"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/bench-comparison"
          mkdir -p "${out}"
          {
            echo "### Base against head timing (advisory)"
            echo
            echo "This comparison does not fail the pull request. It becomes a required check only once an A/A calibration of this suite on this runner class shows false alarms under 1%."
          } >> "${GITHUB_STEP_SUMMARY}"
          stop() {
            echo "::warning::bench-compare: $1; nothing was compared, and the pull request is not failed for it"
            { echo; echo "Not run: $1."; } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          }
          if [ -z "${BASE_SHA}" ]; then stop "this run names no base commit"; fi
          if ! pnpm install --frozen-lockfile || ! pnpm build; then stop "the head did not install or build"; fi
          head_sha="$(git rev-parse HEAD)"
          base_dir="${RUNNER_TEMP}/bench-base"
          if ! git worktree add --quiet --detach "${base_dir}" "${BASE_SHA}"; then stop "the base commit ${BASE_SHA} could not be checked out"; fi
          if ! (cd "${base_dir}" && pnpm install --frozen-lockfile && pnpm build); then stop "the base did not install or build"; fi
          status=0
          timeout --kill-after=10 "${BENCH_BUDGET_SECONDS}" pnpm exec cosyte-bench compare --suite "${BENCH_SUITE}" \
            --base "${base_dir}/${BENCH_TARGET}" --head "${BENCH_TARGET}" \
            --base-commit "${BASE_SHA}" --head-commit "${head_sha}" \
            --out "${out}/dates.json" --summary "${out}/dates.md" || status=$?
          case "${status}" in
            0) ;;
            1) echo "::warning::bench-compare: the head is slower than the base beyond the threshold in at least one case. Advisory: this does not fail the pull request" ;;
            2) echo "::notice::bench-compare: could not measure every case (a skip, or a process that died), and a skip is not a pass" ;;
            124 | 137) echo "::warning::bench-compare: stopped at the end of the ${BENCH_BUDGET_SECONDS} second budget" ;;
            *) echo "::warning::bench-compare: cosyte-bench exited ${status}" ;;
          esac
          if [ -f "${out}/dates.md" ]; then
            { echo; cat "${out}/dates.md"; } >> "${GITHUB_STEP_SUMMARY}"
          else
            { echo; echo "No results: cosyte-bench exited ${status}."; } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [ -f "${out}/dates.json" ] && ! pnpm exec cosyte-bench check "${out}/dates.json"; then
            echo "::warning::bench-compare: ${out}/dates.json does not match the results schema"
          fi
          exit 0
      # `!cancelled()` keeps whatever was written before a timeout or a failed setup step.
      - name: Keep the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-comparison
          path: ${{ runner.temp }}/bench-comparison/
          if-no-files-found: warn
          retention-days: 30
