name: Em-dash gate

# The brand rule (knowledgebase 06-brand/voice-and-tone.md) bans the em dash (U+2014) and the en
# dash (U+2013) across every Cosyte surface, commit messages included. This gate keeps both out of
# the tracked files and out of the text a squash merge composes. A green run on a clean tree proves
# nothing on its own, which is why the script it calls refuses to print OK from a scan that did not
# read everything.
#
# WHY A SEPARATE WORKFLOW, and not only the rung in `ci.yml`: the trigger. The PR-text half below
# needs the `edited` activity type, which is not a default: without it, a title or body edited
# after the last push is never re-checked, and since this repo squash-merges, the PR title and body
# ARE the commit message that lands on main. Re-running the whole build every time someone fixes a
# typo in a PR description would be a large cost for no extra safety. Both halves live here: the
# file scan is a checkout and one grep, so it costs nothing to re-run on `edited`.
#
# The job id is the required check `no-emdash` in the `ci-required-checks` ruleset (see
# `.github/CI.md`): rename it and every pull request waits on a context nothing emits.
#
# Run it locally with `pnpm check:no-emdash` (`bash scripts/check-no-emdash.sh`), and check PR text
# with `bash scripts/check-no-emdash.sh --stdin pr < body.md`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-emdash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the commit-message step below reads the PR's commit range,
          # and the default shallow clone does not contain the base commit.
          fetch-depth: 0

      - name: Check tracked files
        run: bash scripts/check-no-emdash.sh

      # The rule names commit messages explicitly, and a squash merge composes its message
      # from the PR title, the PR body, and the branch commits, so all three are checked.
      # Pull requests only: on a push to main the message is already written, and this gate
      # exists to stop it landing.
      - name: Check PR title, body, and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Collect first, scan second, and set the shell options here rather than trust the
          # runner's default: piping the collection straight into the scanner would hide a
          # failed `git log` (a rewritten base commit, or a future edit that drops
          # fetch-depth) behind a clean title and body, and the gate would print OK over
          # commits it never read. The title and body arrive through env and are never
          # interpolated into the script, so a PR description cannot inject shell.
          set -euo pipefail
          {
            printf '%s\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
            git log --format=%B "$BASE_SHA..$HEAD_SHA"
          } > "$RUNNER_TEMP/pr-messages.txt"
          bash scripts/check-no-emdash.sh --stdin "the PR title, body, or commit messages" \
            < "$RUNNER_TEMP/pr-messages.txt"
