name: Public-surface gate

# No internal project bookkeeping on a public surface: the README, the pages under `docs-content/`,
# the npm description and keywords, and the doc comments that compile into the shipped type
# declarations. The scan is `pnpm check:no-internal-refs`, a thin caller of the shared
# `@cosyte/script-utils/internal-refs` engine, so it needs the dependencies installed: this calls the
# INSTALLING variant of the shared gate, pinned to a published reference of cosyte/.github.
#
# The job id is the check context (`no-internal-refs / public-surface`), the same one every other
# @cosyte/* package reports.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-internal-refs:
    # A published reference (ST37): a `workflows-*` release of cosyte/.github. Those releases
    # are immutable, so the tag is locked to one commit, and every caller here moves to the
    # next reference together.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    permissions:
      contents: read
